# ============================================================================
# Cloudflare **Pages** 形态的配置（与 Workers 形态的 wrangler.toml 并存）
#
# 为什么另开一份：Pages 的配置里**不能出现** `main` / `[assets]` / `run_worker_first`
# （那些是 Workers 的形态），而 Workers 那份必须保留（本地 `wrangler dev`、CI 都在用）。
#
# 部署用：`npm run pages:deploy`（= node scripts/pages-deploy.mjs）
#   它会读本机 `.env.deploy`，把**项目名 / D1 ID / KV ID** 注入一份临时配置再部署 ——
#   所以这个文件里出现的是占位，仓库里永远不会有别人的账号信息。
#
# 国内可直接访问：`https://<项目名>.pages.dev`（实测 pages.dev 可达，workers.dev 不可达）
# ============================================================================
name = "kingcola-app"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

# ---------------------------------------------------------------------------
# 绑定：D1 / KV / R2（ID 由 pages-deploy 从本机 .env.deploy 注入；填了 ID 就不会去新建）
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "kingcola-db"
# database_id = "<由 pages-deploy 注入>"

[[kv_namespaces]]
binding = "CONFIG_KV"
# id = "<由 pages-deploy 注入>"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kingcola-files"

# ---------------------------------------------------------------------------
# 环境变量（敏感值走 `wrangler pages secret`，不要写这里）
# ---------------------------------------------------------------------------
[vars]
ALLOWED_ORIGINS = ""
SSO_AUTHORIZE_BASE = ""
SSO_CLIENT_ID = "kingcola"
# 「是否已安装」的初始标志（由构建/部署创建）；真正的状态在 D1（有没有管理员）
INSTALL_STATE = "uninstalled"
